<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Wordle RO</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <!-- Setup screen -->
      <section id="setup" class="screen setup-screen">
        <header class="setup-header">
          <img class="brand-icon" src="/icon.png" width="88" height="88" alt="" />
          <h1 class="brand">Wordle <span>RO</span></h1>
          <p class="setup-tagline">Ghicește cuvântul din dicționarul românesc</p>
        </header>

        <form id="setup-form" class="setup-form">
          <label class="field">
            <span class="field-label">Limbă</span>
            <select id="language" name="language">
              <option value="ro" selected>Română</option>
            </select>
          </label>

          <label class="field">
            <span class="field-label">
              Număr de litere
              <strong id="letter-count-value" class="field-value">5</strong>
            </span>
            <input
              type="range"
              id="letter-count"
              name="letterCount"
              class="slider"
              min="3"
              max="12"
              step="1"
              value="5"
            />
            <div class="slider-ends"><span>3</span><span>12</span></div>
          </label>

          <label class="field">
            <span class="field-label">Dificultate</span>
            <div class="diff-picker" role="group" aria-label="Dificultate">
              <button type="button" class="diff-btn active" data-difficulty="easy">
                <span class="diff-name">Ușor</span>
                <span class="diff-count" data-count-for="easy">…</span>
              </button>
              <button type="button" class="diff-btn" data-difficulty="medium">
                <span class="diff-name">Mediu</span>
                <span class="diff-count" data-count-for="medium">…</span>
              </button>
              <button type="button" class="diff-btn" data-difficulty="hard">
                <span class="diff-name">Greu</span>
                <span class="diff-count" data-count-for="hard">…</span>
              </button>
              <button type="button" class="diff-btn" data-difficulty="all">
                <span class="diff-name">Toate</span>
                <span class="diff-count" data-count-for="all">…</span>
              </button>
              <button type="button" class="diff-btn" data-difficulty="custom">
                <span class="diff-name">Propriu</span>
                <span class="diff-count" data-count-for="custom">—</span>
              </button>
            </div>
            <input type="hidden" id="difficulty" name="difficulty" value="easy" />
          </label>

          <label class="toggle-field">
            <input type="checkbox" id="diacritics" name="diacritics" checked />
            <span class="toggle-ui" aria-hidden="true"></span>
            <span class="toggle-text">
              <strong>Joacă cu diacritice</strong>
              <small>Cuvintele păstrează ă, â, î, ș, ț — potriviri apropiate apar violet</small>
            </span>
          </label>

          <label class="toggle-field nested-toggle hidden" id="diacritics-soft-wrap">
            <input type="checkbox" id="diacritics-soft" name="diacriticsSoft" />
            <span class="toggle-ui" aria-hidden="true"></span>
            <span class="toggle-text">
              <strong>Nu forța diacriticele</strong>
              <small>Transformă cuvântul fără diacritice; ghicești doar cu a–z, fără taste ăâîșț</small>
            </span>
          </label>

          <div class="setup-actions">
            <button type="submit" class="btn-primary">Începe jocul</button>
            <button type="button" id="btn-wordlist" class="btn-secondary">Vezi lista cuvinte</button>
            <button type="button" id="btn-help" class="btn-secondary">Ajutor</button>
          </div>
        </form>
      </section>

      <!-- Word list screen -->
      <section id="wordlist" class="screen wordlist-screen hidden">
        <header class="help-header">
          <button type="button" id="btn-wordlist-back" class="icon-btn" aria-label="Înapoi">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 18l-6-6 6-6" />
            </svg>
          </button>
          <h2>Lista de cuvinte</h2>
          <span class="help-header-spacer"></span>
        </header>

        <div class="wordlist-controls">
          <label class="field">
            <span class="field-label">
              Număr de litere
              <strong id="wordlist-letter-count-value" class="field-value">5</strong>
            </span>
            <input
              type="range"
              id="wordlist-letter-count"
              class="slider"
              min="3"
              max="12"
              step="1"
              value="5"
            />
            <div class="slider-ends"><span>3</span><span>12</span></div>
          </label>

          <div class="field">
            <span class="field-label">Dificultate</span>
            <div class="diff-picker wordlist-diff-picker" role="group" aria-label="Dificultate">
              <button type="button" class="diff-btn active" data-difficulty="easy">
                <span class="diff-name">Ușor</span>
                <span class="diff-count" data-count-for="easy">…</span>
              </button>
              <button type="button" class="diff-btn" data-difficulty="medium">
                <span class="diff-name">Mediu</span>
                <span class="diff-count" data-count-for="medium">…</span>
              </button>
              <button type="button" class="diff-btn" data-difficulty="hard">
                <span class="diff-name">Greu</span>
                <span class="diff-count" data-count-for="hard">…</span>
              </button>
              <button type="button" class="diff-btn" data-difficulty="all">
                <span class="diff-name">Toate</span>
                <span class="diff-count" data-count-for="all">…</span>
              </button>
            </div>
          </div>
        </div>

        <p id="wordlist-status" class="wordlist-status" aria-live="polite"></p>
        <div id="wordlist-body" class="wordlist-body"></div>
      </section>

      <!-- Help screen (scrollable) -->
      <section id="help" class="screen help-screen hidden">
        <header class="help-header">
          <button type="button" id="btn-help-back" class="icon-btn" aria-label="Înapoi">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 18l-6-6 6-6" />
            </svg>
          </button>
          <h2>Ajutor</h2>
          <span class="help-header-spacer"></span>
        </header>
        <div id="help-body" class="help-body"></div>
      </section>

      <!-- Game screen -->
      <section id="game" class="screen game-screen hidden">
        <header class="game-header">
          <button type="button" id="btn-back" class="icon-btn" aria-label="Înapoi la setări" title="Setări">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 18l-6-6 6-6" />
            </svg>
          </button>

          <div class="mode-pills">
            <button type="button" class="pill active" id="mode-label">Nelimitat</button>
          </div>

          <div class="header-actions">
            <button type="button" id="btn-new" class="icon-btn" aria-label="Cuvânt nou" title="Cuvânt nou">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M23 4v6h-6M1 20v-6h6" />
                <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" />
              </svg>
            </button>
          </div>
        </header>

        <p id="status" class="status" aria-live="polite"></p>

        <div class="board-wrap">
          <div id="board" class="board" aria-label="Grilă de joc"></div>
        </div>

        <div id="keyboard" class="keyboard" aria-label="Tastatură"></div>

        <footer class="legend">
          <div class="legend-item">
            <span class="swatch correct"></span>
            <span>Loc corect</span>
          </div>
          <div class="legend-item">
            <span class="swatch present"></span>
            <span>Altă poziție</span>
          </div>
          <div class="legend-item">
            <span class="swatch diacritic"></span>
            <span>Grup diacritic</span>
          </div>
          <div class="legend-item">
            <span class="swatch absent"></span>
            <span>Absent</span>
          </div>
        </footer>

        <!-- Win / lose overlay -->
        <div id="end-overlay" class="end-overlay hidden" role="dialog" aria-modal="true">
          <div class="end-card">
            <p id="end-emoji" class="end-emoji" aria-hidden="true"></p>
            <h2 id="end-title" class="end-title"></h2>
            <p id="end-detail" class="end-detail"></p>
            <button type="button" id="btn-play-again" class="btn-primary">Joacă din nou</button>
            <button type="button" id="btn-end-setup" class="btn-secondary">Înapoi la setări</button>
          </div>
        </div>
      </section>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>

    <div
      id="custom-word-overlay"
      class="modal-overlay hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="custom-word-title"
    >
      <form id="custom-word-form" class="modal-card">
        <h2 id="custom-word-title" class="modal-title">Cuvânt propriu</h2>
        <p class="modal-detail">Introdu un cuvânt de 3–12 litere</p>
        <input
          type="text"
          id="custom-word-input"
          class="modal-input"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="characters"
          spellcheck="false"
          maxlength="12"
          inputmode="text"
          placeholder="ex. casă"
        />
        <button type="submit" class="btn-primary">Setează</button>
        <button type="button" id="custom-word-cancel" class="btn-secondary">
          Anulează
        </button>
      </form>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
